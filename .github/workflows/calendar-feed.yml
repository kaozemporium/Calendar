name: Update calendar feed

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes — adjust if you want it fresher/lazier
  workflow_dispatch:          # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Generate calendar.ics
        run: node scripts/generate-ics.js
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Update Discord embed
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        run: node scripts/update-discord-embed.js
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Save Discord message ID (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state/discord-message.json ]; then
            git add state/discord-message.json
            if ! git diff --cached --quiet; then
              git commit -m "Update saved Discord message ID"
              git push
            else
              echo "No change to commit."
            fi
          else
            echo "No state file to commit."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
